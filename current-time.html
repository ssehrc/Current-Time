<!DOCTYPE html>

<html>
    
    <head>
        <title>Current Time</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1"> <!--responsive time-->

        <link rel="stylesheet" href="styles/current-time.css">
        <link rel="stylesheet" href="styles/change-time-zone.css">
        <link rel="stylesheet" href="styles/micromodal.css">
        
    </head>
    <body>
        
            <!-- show/hide.                 tells readers the modal is hidden initially-->
            <div id="modal-1" aria-hidden="true">
                <!-- not navigated by keyboard      clicking this closes the modal -->
                <div tabindex="-1" data-micromodal-close>
                    <!-- tells user this is a dialog. v this is a modal dialog  v links modal to title-->
                    <div role="dialog" aria-modal="true" aria-labelledby="modal-1-title">
                        <header>
                            <h2 id="modal-1-title">Change Timezone</h2>
                            <!-- [4] -->
                            <button aria-label="Close modal" data-micromodal-close>apply</button>
                        </header>
                        
                        <div id="modal-1-content">
                            Pick a timezone
                            <button class="timezone-option" data-timezone="America/New_York">New York</button>
                            <button class="timezone-option" data-timezone="Europe/London">London</button>
                            <button class="timezone-option" data-timezone="Asia/Tokyo">Tokyo</button>
                            <button class="timezone-option" data-timezone="Australia/Sydney">Sydney</button>
                        </div>
                    </div>
                </div>
            </div>
        
        <div class="container">
            <button id="open-timezone-window" >Timezone</button>
            
            <div id="js-time"> 
                <span id="hrs">00</span>
                <span>:</span>
                <span id="mins">00</span> 
                <span>:</span> 
                <span id="secs">00</span>  
            </div>
            <div id="js-date">
                <span id="date">dddd, D MMMM, YYYY</span>
            </div>
        </div>
        
        
        <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/utc.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/timezone.js"></script>
        <script src="https://unpkg.com/micromodal/dist/micromodal.min.js"></script>
        <script src="scripts/current-time.js"></script>
        <script src="scripts/change-time-zone.js"></script>
        

    </body>
    
</html>
